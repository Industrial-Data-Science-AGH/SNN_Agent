<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}wakeup-ai dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-mark" src="/static/img/ids-logo.png" alt="Industrial Data Science — wakeup-ai dashboard">
    </a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
    integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt"
    crossorigin="anonymous"
  ></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
