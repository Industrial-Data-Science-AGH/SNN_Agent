name: W0 integration gate
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: contracts-and-mock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Avoid checking out historical training datasets for a lightweight gate.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitmodules
            /contracts/
            /rpi_agents/
            /tests/w0/
            /snn_runtime/
            /tests/runtime/
            /requirements-w0.lock
            /ruff-w0.toml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: python -m pip install --require-hashes -r requirements-w0.lock
      # Modules that arrive later are added here AND to the sparse-checkout list above. Directories that do not exist yet
      # are skipped, so this file can merge before or after the module it covers; the first three are mandatory.
      - name: Lint integration foundation
        run: |
          paths="contracts rpi_agents tests/w0"
          for extra in snn_runtime tests/runtime; do [ -d "$extra" ] && paths="$paths $extra"; done
          echo "linting: $paths"
          python -m ruff check --config ruff-w0.toml $paths
      - name: Validate contracts and test demo API
        run: |
          paths="tests/w0"
          [ -d tests/runtime ] && paths="$paths tests/runtime"
          echo "testing: $paths"
          python -m pytest $paths -q
  pr-gate:
    name: pr-gate
    if: ${{ always() }}
    needs: [contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          RESULT: ${{ needs.contracts.result }}
        run: test "$RESULT" = success
