name: C++ Tests

on:
  push:
    branches: [ "dev", "feat/encoder" ]
    paths:
      - 'encoder_tests/**'
      - '**/*.ino'
      - '**/*.cpp'
      - '**/*.h'
  pull_request:
    branches: [ "dev" ]
    paths:
      - 'encoder_tests/**'
      - '**/*.ino'
      - '**/*.cpp'
      - '**/*.h'

jobs:
  run-cpp-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Build Tools
      run: sudo apt-get update && sudo apt-get install -y build-essential
    - name: Compile and Run
      run: |
        cd encoder_tests
        g++ -O2 test_encoder.cpp -o test_runner
        ./test_runner