name: W0 integration gate
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: contracts-and-mock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Avoid checking out historical training datasets for a lightweight gate.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitmodules
            /contracts/
            /rpi_agents/
            /tests/w0/
            /requirements-w0.lock
            /ruff-w0.toml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: python -m pip install --require-hashes -r requirements-w0.lock
      - name: Lint integration foundation
        run: python -m ruff check --config ruff-w0.toml contracts rpi_agents tests/w0
      - name: Validate contracts and test demo API
        run: python -m pytest tests/w0 -q
  pr-gate:
    name: pr-gate
    if: ${{ always() }}
    needs: [contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          RESULT: ${{ needs.contracts.result }}
        run: test "$RESULT" = success
